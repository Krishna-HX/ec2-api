
name: FastAPI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Check code quality
        run: ruff check .

      - name: Build Docker image
        run: docker build -t ec2-fastapi:ci-test .

      - name: Smoke test container
        run: |
          docker run -d --name smoke-api -p 8080:8000 ec2-fastapi:ci-test
          curl --retry 10 --retry-delay 1 --retry-connrefused -fsS http://localhost:8080/
          docker rm -f smoke-api
